# What each chat was actually about -- one sentence, AUTHORED.
#
# `index.py`'s FORBIDDEN_KEY rejects any shard field matching /summary|content|
# message|text|body/, so a machine-derived shard can never carry this: the
# index is metadata-only by design and a span plus an exchange count says how
# MUCH happened, never what it was. The dashboard rendered exactly that and it
# read as filler.
#
# So the sentence lives here instead, authored the way `attribution.yaml` is
# authored -- which also makes it editable. Every line below is published to a
# world-readable page. Shorten one, or delete it and the row falls back to the
# metadata line; set the chat to `none` in `attribution.yaml` to drop it from
# the page entirely.
#
# Seeded 2026-08-23 from the opening ask of each transcript still on this
# machine. Nine of fifteen had none -- codex threads, or transcripts since
# rotated away -- and those are absent here rather than guessed.

