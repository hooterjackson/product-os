# Web-chat PRESENCE. Tracked, and therefore public.
#
# A web or cloud chat has no CLI and no session file, so the indexer cannot find
# a way back to it. Without a hand-written pointer a RESUME verdict on one is a
# dead end wearing a green label.
#
# THE URL DOES NOT GO IN THIS FILE. This repo is public (DEC-201) and this file
# is tracked, so a URL here is a published link to a private conversation --
# the same class R-062 removed from public/, arriving by a third route into
# authored state, where the generated surface's redaction cannot reach.
#
#   this file (tracked)                 GB-001: work-laptop 2026-08-20
#   state/threads/manual.local.yaml     GB-001: https://claude.ai/chat/...
#     (git-ignored)
#
# The tracked half syncs the honest signal to every machine and to public/: a
# chat exists, on that machine, since that date. The URL stays on the one
# machine that can open it, which needs his login anyway.
#
# THE RULE IS ABOUT THE URL, NOT ABOUT THIS FILE. Presence is public wherever
# it is written; the URL is local wherever it is written -- never a tracked
# file, never a GitHub issue (this repo is public, so its issues are
# world-readable), never a generated page. See wiki/ruled-out.md R-076.
#
# WHAT THIS COSTS, so it is known rather than found: the local half is
# UNTRACKED, and untracked means UNBACKED-UP. A clean clone or a dead laptop
# loses every URL in it. Accepted deliberately -- the chat itself still exists
# on claude.ai and is reachable from its own session picker, so what is lost is
# a shortcut, not the conversation. The presence half survives, which is why it
# is the half that is tracked.
#
# Format: <ITEM-ID>: <machine> <YYYY-MM-DD>   -- one per line, # comments fine.
# validate.py fails if a URL appears here (E-MANUAL-URL-TRACKED), so the split
# cannot erode by accident.
#
# Example:
#   GB-001: work-laptop 2026-08-20
