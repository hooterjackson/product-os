# Deploy public/ to GitHub Pages.
#
# ACTIONS, not a branch source. A branch source would publish the whole
# repository as a browsable site — state/, tools/, wiki/ and all — for no gain,
# and it is also the only way to enable Pages before this file exists, which is
# why Pages stays off until this lands.
#
# NO CNAME FILE. The custom domain is set in Settings → Pages and stored in the
# repository's Pages config; an Actions deploy does not need one in the
# artifact. It must not be hand-placed either: `publish.py --check` walks the
# target and reports anything the generator did not produce as `orphan:`,
# exit 1 — so a hand-placed public/CNAME turns the gate red and the next
# publish deletes it. If one ever proves necessary, `surface.py` emits it and
# `advertised()` expects it.
#
# There is no build step. This repo is stdlib Python and public/ is committed,
# so the job's real work is REFUSING TO DEPLOY a surface the gate rejects.

name: Pages

on:
  push:
    branches: [main]
  # A write filed from a phone arrives as an ISSUE, and until this trigger
  # existed nothing read it: Marcelo attributed a chat, the issue opened
  # correctly, and the chat did not move. A button that files into a queue with
  # no consumer is worse than no button — it looks like it worked.
  #
  # The drain lives HERE rather than in its own workflow because a push made
  # with GITHUB_TOKEN does not trigger another workflow run. A separate intake
  # workflow would commit the change and never deploy it — the same defect one
  # layer further along.
  issues:
    types: [opened, labeled, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one in flight, because a half-replaced
# surface is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Drain first, so the gate tests the state the issue just changed.
  intake:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.author_association == 'OWNER' &&
      github.event.issue.user.login == 'hooterjackson'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Defence in depth. The `if:` above stops a stranger's issue starting
      # this job at all; intake.py re-checks author AND association on every
      # issue it reads, because the label is not a permission — this repo is
      # public and its issue forms are world-writable.
      - name: Drain the issues into state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 tools/intake.py
          code=$?
          set -e
          # 1 means something was REFUSED — a normal outcome that must not stop
          # the site deploying. 2 means GitHub was unreachable, and "I could
          # not look" must never pass as "nothing waiting".
          if [ "$code" -ge 2 ]; then exit "$code"; fi
          if [ "$code" -eq 1 ]; then
            echo "::warning::intake refused at least one issue — see the log"
          fi

      - name: Commit whatever it changed
        run: |
          python3 tools/publish.py
          if git diff --quiet; then echo "nothing changed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Drain issue #${{ github.event.issue.number }}"
          git push

  gate:
    needs: [intake]
    # `always()` so a push event still runs this with intake SKIPPED. A FAILED
    # intake stops here: deploying a surface built from a half-applied write is
    # worse than deploying yesterday's.
    if: always() && needs.intake.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `main`, not the event ref: on an issues event the default ref is
          # the branch head from BEFORE intake pushed, so the gate would test
          # and deploy a surface without the change that triggered it.
          ref: main
          # check_authority and check_commit_identities read history; a shallow
          # clone makes them pass by seeing nothing, which is R-075's shape.
          fetch-depth: 0

      - name: The gate that decides whether this deploys
        run: |
          python3 -m unittest discover -s tests -v
          python3 tools/validate.py

      - name: public/ must match a fresh generation
        run: python3 tools/publish.py --check

      # A remote fact the offline suite cannot know. GitHub accepts a template
      # naming a label the repo does not have, renders a perfect form, and
      # files with no label -- and intake.py drains BY LABEL.
      - name: Every label the issue forms declare must exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/labels.py --check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
